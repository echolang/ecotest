name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v5

      - uses: echolang/setup-echo@v1

      - name: Build and test
        run: |
          epm install
          echoc test

  # the tool and ecotest-http link libcurl. ecotest-nexus is left out: it depends on nexus and
  # container by sibling path
  modules:
    name: modules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v5

      - uses: echolang/setup-echo@v1

      - name: Install libcurl
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: ecotest-tool
        working-directory: modules/tool
        run: |
          epm install
          echoc test

      - name: ecotest-http
        working-directory: modules/http
        run: |
          epm install
          echoc test
