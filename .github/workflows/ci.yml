name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v5

      - uses: echolang/setup-echo@v1
        with:
          version: 0.14.0

      - name: Build and test
        run: |
          epm install
          echoc build --target ecotest
          ./ecobuild/ecotest ${{ runner.os != 'Windows' && '--coverage' || '' }}

  modules:
    name: modules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v5

      - uses: echolang/setup-echo@v1
        with:
          version: 0.14.0

      - name: Install libcurl
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: ecotest (exe)
        run: |
          epm install
          echoc build --target ecotest

      - name: ecotest-tool
        working-directory: modules/tool
        run: |
          epm install
          echoc test

      - name: ecotest-http
        working-directory: modules/http
        run: |
          epm install
          epm run ecotest --coverage
